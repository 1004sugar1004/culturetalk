<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>다양한 문화 공감 톡 💬</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- 스마트폰 프레임 -->
    <div class="phone-frame">
        <div class="phone-screen">
            <!-- 이름 입력 화면 -->
            <div id="name-input-screen" class="screen active">
                <div class="name-input-container">
                    <div class="name-screen-title">
                        <h1>💬 다양한 문화 공감 톡</h1>
                    </div>
                    
                    <div class="welcome-message">
                        <p>안녕하세요! '다양한 문화 공감 톡'에 오신 것을 환영합니다.</p>
                        <p>이웃들과의 대화를 통해 다양한 문화의 좋은 점과 문제점을 찾아보세요.</p>
                        <p class="highlight">먼저, 당신의 이름을 입력해 주세요.</p>
                    </div>
                    
                    <div class="name-input-box">
                        <input 
                            type="text" 
                            id="user-name-input" 
                            class="user-name-input" 
                            placeholder="이름을 입력하세요"
                            maxlength="10"
                        />
                        <button class="name-submit-btn" id="name-submit-btn">시작하기</button>
                    </div>
                </div>
            </div>

            <!-- 캐릭터 선택 화면 -->
            <div id="character-select-screen" class="screen">
                <div class="header">
                    <h1>💬 다양한 문화 공감 톡</h1>
                    <p class="subtitle">우리 동네 이웃과 대화하며<br>다양한 문화를 이해해보세요</p>
                </div>
                
                <div class="character-list" id="character-list">
                    <!-- 캐릭터 목록이 동적으로 로드됩니다 -->
                </div>
            </div>

            <!-- 채팅 화면 -->
            <div id="chat-screen" class="screen">
                <!-- 채팅 헤더 -->
                <div class="chat-header">
                    <button class="back-btn" id="back-btn">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M15 18l-6-6 6-6"/>
                        </svg>
                    </button>
                    <div class="chat-header-info">
                        <div class="chat-profile-img" id="chat-profile-img"></div>
                        <div>
                            <h2 id="chat-name"></h2>
                            <p class="chat-status" id="chat-status"></p>
                        </div>
                    </div>
                </div>

                <!-- 채팅 메시지 영역 -->
                <div class="chat-messages" id="chat-messages">
                    <!-- 메시지가 동적으로 추가됩니다 -->
                </div>

                <!-- 채팅 입력 영역 -->
                <div class="chat-input-area">
                    <input 
                        type="text" 
                        id="message-input" 
                        class="message-input" 
                        placeholder="메시지를 입력하세요..."
                    />
                    <button class="send-btn" id="send-btn">전송</button>
                </div>

                <!-- 추천 질문 안내 및 버튼 -->
                <div class="suggestion-container">
                    <div class="suggestion-guide">
                        💡 아래 추천 질문을 클릭하면 편하게 대화할 수 있어요!
                    </div>
                    <div class="suggested-questions" id="suggested-questions">
                        <!-- 추천 질문이 동적으로 추가됩니다 -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="contact-info">
        오류문의 nalrary@mensakorea.org
    </div>

    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
